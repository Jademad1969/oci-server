<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About System - Discover Islam Society</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">
    {% include 'sidebar.html' %}

    <div class="flex-1 flex flex-col items-center justify-center min-h-screen p-8">
        <div class="bg-white p-12 rounded-2xl border border-slate-200 shadow-sm text-center max-w-xl w-full">
            <div class="w-16 h-16 rounded-2xl bg-blue-600 text-white font-bold text-2xl flex items-center justify-center mx-auto mb-5 shadow-md">
                DIS
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Discover Islam Society</h1>
            <h2 class="text-xl font-bold text-blue-700 mt-2" style="font-family: 'Cairo', sans-serif;">جمعية اكتشف الإسلام</h2>

            <div class="mt-7 pt-6 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-3 text-left">
                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80">
                    <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Environment</div>
                    <div class="mt-1.5 flex items-center gap-2">
                        <span class="px-2 py-0.5 rounded-full text-xs font-bold {% if APP_ENV_INFO.is_production %}bg-emerald-100 text-emerald-800 border border-emerald-300{% elif APP_ENV_INFO.is_testing %}bg-amber-100 text-amber-900 border border-amber-300{% else %}bg-indigo-100 text-indigo-800 border border-indigo-300{% endif %}">
                            {{ APP_ENV_INFO.label }}
                        </span>
                    </div>
                    <div class="text-xs text-slate-500 mt-1" style="font-family: 'Cairo', sans-serif;">{{ APP_ENV_INFO.label_ar }}</div>
                </div>

                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80">
                    <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Version</div>
                    <div class="mt-1.5 text-sm font-bold font-mono text-slate-800">{{ APP_ENV_INFO.version }}</div>
                    <div class="text-xs text-slate-500 mt-1">ERP Platform</div>
                </div>

                <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80">
                    <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Database</div>
                    <div class="mt-1.5 text-sm font-bold font-mono text-slate-800 truncate" title="{{ APP_ENV_INFO.db_name }}">{{ APP_ENV_INFO.db_name }}</div>
                    <div class="text-xs text-slate-500 mt-1">Active Schema</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
