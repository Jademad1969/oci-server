<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Login - Discover Islam Society</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Discover Islam Society</h1>
            <p class="text-xs text-slate-500 mt-1">Standing Orders Management System</p>
        </div>

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label>
                <input type="text" name="username" required placeholder="e.g. TAREK"
                       class="w-full h-10 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm font-mono focus:outline-none focus:border-blue-600 focus:bg-white">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full h-10 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm font-mono focus:outline-none focus:border-blue-600 focus:bg-white">
            </div>
            <button type="submit"
                    class="w-full h-10 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm shadow-md transition duration-200">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
