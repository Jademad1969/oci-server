<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users & Page Permissions - Discover Islam Society</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800" x-data="usersMasterDetailApp()" x-init="loadUsers()">
    {% include 'sidebar.html' %}

    <div class="p-6 max-w-6xl mx-auto w-full space-y-5">
        <!-- Top Header -->
        <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-2xs">
            <div>
                <h1 class="text-base font-bold text-slate-900">Users & Hierarchical Page Permissions</h1>
                <p class="text-xs text-slate-500">Select a user on the left (Master) and configure module/page privileges on the right (Detail)</p>
            </div>
            <button @click="openCreateModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-2xs transition">
                + Add New User
            </button>
        </div>

        <!-- Master-Detail Split Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">

            <!-- MASTER: Users List (4 Cols) -->
            <section class="lg:col-span-4 bg-white rounded-xl border border-slate-200 shadow-2xs overflow-hidden">
                <div class="px-4 py-3 bg-slate-800 text-white flex items-center justify-between">
                    <span class="text-xs font-bold uppercase tracking-wider">Users (Master)</span>
                    <span class="text-[11px] font-mono bg-slate-700 px-2 py-0.5 rounded" x-text="users.length"></span>
                </div>

                <div class="divide-y divide-slate-200">
                    <template x-for="u in users" :key="u.user_id">
                        <button type="button" @click="selectUser(u)"
                                :class="selectedUser && selectedUser.user_id === u.user_id ? 'bg-blue-50/90 border-l-4 border-l-blue-600' : 'hover:bg-slate-50 border-l-4 border-l-transparent'"
                                class="w-full text-left p-3.5 transition flex items-center justify-between gap-2">
                            <div class="min-w-0">
                                <div class="font-mono font-bold text-xs text-slate-900 truncate" x-text="u.username"></div>
                                <div class="text-[11px] text-slate-500 truncate" x-text="u.full_name_en || u.full_name_ar"></div>
                            </div>
                            <div class="text-right shrink-0">
                                <span class="inline-block text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200"
                                      x-text="countEditablePages(u) + ' Edit / ' + countViewablePages(u) + ' View'"></span>
                            </div>
                        </button>
                    </template>
                    <div x-show="users.length === 0" class="p-6 text-center text-xs text-slate-400">
                        No users found.
                    </div>
                </div>
            </section>

            <!-- DETAIL: Hierarchical Module -> Page Tree (8 Cols) -->
            <section class="lg:col-span-8 bg-white rounded-xl border border-slate-200 shadow-2xs p-4 space-y-4" x-show="selectedUser">
                <template x-if="selectedUser">
                    <div class="space-y-4">
                        <!-- Selected User Header -->
                        <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-200">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h2 class="text-sm font-bold text-slate-900 font-mono" x-text="selectedUser.username"></h2>
                                    <span :class="selectedUser.is_active ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'"
                                          class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                                          x-text="selectedUser.is_active ? 'Active' : 'Disabled'"></span>
                                </div>
                                <p class="text-xs text-slate-500" x-text="selectedUser.full_name_en || selectedUser.full_name_ar"></p>
                            </div>

                            <div class="flex items-center gap-2">
                                <button type="button" @click="resetPassword(selectedUser)"
                                        class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-xs font-semibold text-blue-700">
                                    Reset Password
                                </button>
                                <button type="button" @click="savePagePermissions(selectedUser)"
                                        class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-2xs">
                                    Save Permissions
                                </button>
                            </div>
                        </div>

                        <!-- Hierarchy Groups -->
                        <div class="space-y-3">
                            <template x-for="grp in moduleHierarchy" :key="grp.group_id">
                                <div class="border border-slate-200 rounded-xl overflow-hidden">
                                    <!-- Module Header Row -->
                                    <div class="bg-slate-100 px-3.5 py-2.5 flex flex-wrap items-center justify-between gap-2 border-b border-slate-200">
                                        <button type="button" @click="grp.expanded = !grp.expanded" class="flex items-center gap-2 text-left">
                                            <span class="font-mono text-xs text-slate-500" x-text="grp.expanded ? '▼' : '▶'"></span>
                                            <span class="text-xs font-bold text-slate-800" x-text="grp.group_label"></span>
                                            <span class="text-[11px] text-slate-500" x-text="'(' + grp.pages.length + ' pages)'"></span>
                                        </button>

                                        <!-- Quick Bulk Set for Entire Module -->
                                        <div class="flex items-center gap-1.5 text-[11px]">
                                            <span class="text-slate-500 mr-1">Set group:</span>
                                            <button type="button" @click="setGroupAccess(grp, 'none')" class="px-2 py-0.5 rounded bg-white border border-slate-300 hover:bg-slate-200 font-semibold">None</button>
                                            <button type="button" @click="setGroupAccess(grp, 'view')" class="px-2 py-0.5 rounded bg-amber-50 border border-amber-300 text-amber-900 hover:bg-amber-100 font-semibold">View</button>
                                            <button type="button" @click="setGroupAccess(grp, 'edit')" class="px-2 py-0.5 rounded bg-emerald-50 border border-emerald-300 text-emerald-900 hover:bg-emerald-100 font-semibold">Edit</button>
                                        </div>
                                    </div>

                                    <!-- Child Pages -->
                                    <div x-show="grp.expanded" class="divide-y divide-slate-100 bg-white">
                                        <template x-for="pg in grp.pages" :key="pg.key">
                                            <div class="px-4 py-2.5 flex items-center justify-between gap-3 hover:bg-slate-50/70">
                                                <div class="pl-4 border-l-2 border-slate-200">
                                                    <div class="text-xs font-semibold text-slate-800" x-text="pg.label"></div>
                                                    <div class="text-[11px] font-mono text-slate-400" x-text="pg.route"></div>
                                                </div>

                                                <select x-model="selectedUser.page_permissions[pg.key]"
                                                        :class="levelBadgeClass(selectedUser.page_permissions[pg.key])"
                                                        class="border rounded-lg px-3 py-1 text-xs font-bold">
                                                    <option value="none">None (Hidden / Blocked)</option>
                                                    <option value="view">View (Read Only)</option>
                                                    <option value="edit">Edit (Read & Modify)</option>
                                                </select>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </section>
        </div>
    </div>

    <!-- Create User Modal -->
    <div x-show="showModal" style="display: none;" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl border border-slate-200 max-h-[90vh] overflow-y-auto" @click.away="showModal = false">
            <h3 class="text-sm font-bold text-slate-900 border-b pb-3 mb-4">Create New User</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs mb-4">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Username</label>
                    <input type="text" x-model="newUser.username" placeholder="e.g. AUDITOR1" class="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono uppercase">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Full Name</label>
                    <input type="text" x-model="newUser.full_name" placeholder="Full Name" class="w-full border border-slate-300 rounded-lg px-3 py-2">
                </div>
                <div class="sm:col-span-2">
                    <label class="block font-semibold text-slate-700 mb-1">Initial Password</label>
                    <input type="password" x-model="newUser.password" placeholder="Password" class="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono">
                </div>
            </div>

            <div class="border-t pt-3 space-y-2.5">
                <div class="text-xs font-bold text-slate-800">Initial Page Permissions by Module</div>
                <template x-for="grp in moduleHierarchy" :key="grp.group_id">
                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-1.5">
                        <div class="text-[11px] font-bold text-slate-700" x-text="grp.group_label"></div>
                        <template x-for="pg in grp.pages" :key="pg.key">
                            <div class="flex items-center justify-between text-xs">
                                <span class="text-slate-700" x-text="pg.label"></span>
                                <select x-model="newUser.page_permissions[pg.key]" class="border border-slate-300 rounded px-2 py-0.5 text-xs font-bold bg-white">
                                    <option value="none">None</option>
                                    <option value="view">View</option>
                                    <option value="edit">Edit</option>
                                </select>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <div class="flex justify-end gap-2 mt-5">
                <button @click="showModal = false" class="px-4 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold text-slate-600">Cancel</button>
                <button @click="createUser()" class="px-4 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-bold hover:bg-blue-700">Create User</button>
            </div>
        </div>
    </div>

    <script>
        function usersMasterDetailApp() {
            return {
                users: [],
                selectedUser: null,
                showModal: false,
                moduleHierarchy: [
                    {
                        group_id: 'general',
                        group_label: 'General System',
                        expanded: true,
                        pages: [
                            { key: 'about', label: 'About System', route: '/about' }
                        ]
                    },
                    {
                        group_id: 'standing_orders',
                        group_label: 'Bank Standing Orders Module',
                        expanded: true,
                        pages: [
                            { key: 'donors', label: 'Donors & Standing Orders', route: '/' },
                            { key: 'audit', label: 'Bank Codes Audit', route: '/bank-codes-audit' },
                            { key: 'reconcile', label: 'Bank Reconciliation', route: '/bank-reconcile' },
                            { key: 'followup', label: 'Donor Follow-up', route: '/followup' }
                        ]
                    },
                    {
                        group_id: 'admin',
                        group_label: 'Administration',
                        expanded: true,
                        pages: [
                            { key: 'users', label: 'Users & Permissions', route: '/users' }
                        ]
                    }
                ],
                newUser: {
                    username: '',
                    full_name: '',
                    password: '',
                    page_permissions: { about: 'view', donors: 'view', audit: 'view', reconcile: 'view', followup: 'view', users: 'none' }
                },
                levelBadgeClass(lvl) {
                    if (lvl === 'edit') return 'bg-emerald-50 text-emerald-800 border-emerald-300';
                    if (lvl === 'view') return 'bg-amber-50 text-amber-800 border-amber-300';
                    return 'bg-slate-100 text-slate-500 border-slate-300';
                },
                countEditablePages(u) {
                    const p = u.page_permissions || {};
                    return Object.values(p).filter(v => v === 'edit').length;
                },
                countViewablePages(u) {
                    const p = u.page_permissions || {};
                    return Object.values(p).filter(v => v === 'view').length;
                },
                selectUser(u) {
                    this.selectedUser = u;
                },
                setGroupAccess(grp, level) {
                    if (!this.selectedUser || !this.selectedUser.page_permissions) return;
                    grp.pages.forEach(pg => {
                        this.selectedUser.page_permissions[pg.key] = level;
                    });
                },
                openCreateModal() {
                    this.newUser = {
                        username: '',
                        full_name: '',
                        password: '',
                        page_permissions: { about: 'view', donors: 'view', audit: 'view', reconcile: 'view', followup: 'view', users: 'none' }
                    };
                    this.showModal = true;
                },
                async loadUsers() {
                    const currentId = this.selectedUser ? this.selectedUser.user_id : null;
                    const res = await fetch('/api/users');
                    if (res.ok) {
                        const data = await res.json();
                        this.users = data.users || [];
                        if (currentId) {
                            this.selectedUser = this.users.find(x => x.user_id === currentId) || this.users[0] || null;
                        } else {
                            this.selectedUser = this.users[0] || null;
                        }
                    }
                },
                async savePagePermissions(u) {
                    if (!u) return;
                    const res = await fetch(`/api/users/${u.user_id}/page-permissions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ page_permissions: u.page_permissions })
                    });
                    if (res.ok) {
                        alert(`Saved page permissions for ${u.username}. Sign out and back in to refresh the session cookie.`);
                    } else {
                        const err = await res.json();
                        alert(err.detail || 'Failed to save page permissions');
                        await this.loadUsers();
                    }
                },
                async createUser() {
                    const res = await fetch('/api/users/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: this.newUser.username,
                            full_name: this.newUser.full_name,
                            password: this.newUser.password,
                            role_id: 2
                        })
                    });
                    if (res.ok) {
                        const createdRes = await fetch('/api/users');
                        if (createdRes.ok) {
                            const listData = await createdRes.json();
                            const target = (listData.users || []).find(x => x.username.toUpperCase() === this.newUser.username.trim().toUpperCase());
                            if (target) {
                                await fetch(`/api/users/${target.user_id}/page-permissions`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ page_permissions: this.newUser.page_permissions })
                                });
                            }
                        }
                        this.showModal = false;
                        await this.loadUsers();
                        alert('User created with hierarchical page permissions.');
                    } else {
                        const err = await res.json();
                        alert(err.detail || 'Error creating user');
                    }
                },
                async resetPassword(u) {
                    const newPass = prompt(`Enter new password for (${u.username}):`, '123456');
                    if (!newPass) return;
                    const res = await fetch(`/api/users/${u.user_id}/password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: newPass })
                    });
                    if (res.ok) alert(`Password updated for ${u.username}.`);
                }
            }
        }
    </script>
</body>
</html>
