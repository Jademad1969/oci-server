<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users & Permissions - Discover Islam Society</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800" x-data="usersApp()" x-init="loadUsers()">
    {% include 'sidebar.html' %}

    <div class="p-6 max-w-5xl mx-auto w-full space-y-6">
        <div class="flex items-center justify-between bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
            <div>
                <h1 class="text-base font-bold text-slate-900">Users & Access Permissions</h1>
                <p class="text-xs text-slate-500">Manage system users and assign access modes (View Only vs. Read & Modify)</p>
            </div>
            <button @click="showModal = true" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-xs transition">
                + Add New User
            </button>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
            <table class="w-full text-xs text-left border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-slate-100">
                        <th class="py-3 px-4">ID</th>
                        <th class="py-3 px-4">Username</th>
                        <th class="py-3 px-4">Full Name</th>
                        <th class="py-3 px-4">Access Permission Mode</th>
                        <th class="py-3 px-4 text-center">Status</th>
                        <th class="py-3 px-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                    <template x-for="u in users" :key="u.user_id">
                        <tr class="hover:bg-slate-50">
                            <td class="py-3 px-4 font-mono font-bold text-slate-600" x-text="u.user_id"></td>
                            <td class="py-3 px-4 font-mono font-bold text-slate-900" x-text="u.username"></td>
                            <td class="py-3 px-4" x-text="u.full_name_en || u.full_name_ar"></td>
                            <td class="py-3 px-4">
                                <select x-model.number="u.role_id" @change="updateUserRole(u)"
                                        class="border border-slate-300 rounded-lg px-2.5 py-1 text-xs font-semibold bg-white">
                                    <option :value="1">Read & Modify (Full Access)</option>
                                    <option :value="2">View Only (Read-Only)</option>
                                </select>
                            </td>
                            <td class="py-3 px-4 text-center">
                                <span :class="u.is_active ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'"
                                      class="px-2.5 py-0.5 rounded-full text-[11px] font-bold"
                                      x-text="u.is_active ? 'Active' : 'Disabled'"></span>
                            </td>
                            <td class="py-3 px-4 text-right space-x-2">
                                <button @click="resetPassword(u)" class="text-blue-600 hover:underline font-semibold">Reset Password</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add User Modal -->
    <div x-show="showModal" style="display: none;" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl border border-slate-200" @click.away="showModal = false">
            <h3 class="text-sm font-bold text-slate-900 border-b pb-3 mb-4">Create New System User</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Username (Login ID)</label>
                    <input type="text" x-model="newUser.username" placeholder="e.g. AHMED" class="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono uppercase">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Full Name</label>
                    <input type="text" x-model="newUser.full_name" placeholder="e.g. Ahmed Al-Binali" class="w-full border border-slate-300 rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Password</label>
                    <input type="password" x-model="newUser.password" placeholder="Enter initial password" class="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Access Permission</label>
                    <select x-model.number="newUser.role_id" class="w-full border border-slate-300 rounded-lg px-3 py-2 font-semibold">
                        <option value="2">View Only (Read-Only)</option>
                        <option value="1">Read & Modify (Full Access)</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-5">
                <button @click="showModal = false" class="px-4 py-1.5 rounded-lg border border-slate-300 text-xs font-semibold text-slate-600">Cancel</button>
                <button @click="createUser()" class="px-4 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-bold hover:bg-blue-700">Create User</button>
            </div>
        </div>
    </div>

    <script>
        function usersApp() {
            return {
                users: [],
                showModal: false,
                newUser: { username: '', full_name: '', password: '', role_id: 2 },
                async loadUsers() {
                    const res = await fetch('/api/users');
                    if (res.ok) {
                        const data = await res.json();
                        this.users = data.users;
                    }
                },
                async createUser() {
                    const res = await fetch('/api/users/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.newUser)
                    });
                    if (res.ok) {
                        this.showModal = false;
                        this.newUser = { username: '', full_name: '', password: '', role_id: 2 };
                        await this.loadUsers();
                        alert('User created successfully.');
                    } else {
                        const err = await res.json();
                        alert(err.detail || 'Error creating user');
                    }
                },
                async updateUserRole(u) {
                    const res = await fetch(`/api/users/${u.user_id}/role`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ role_id: Number(u.role_id) })
                    });
                    if (res.ok) {
                        alert(`Updated permission for ${u.username} successfully.`);
                        await this.loadUsers();
                    } else {
                        const err = await res.json();
                        alert(err.detail || 'Failed to update permission');
                        await this.loadUsers();
                    }
                },
                async resetPassword(u) {
                    const newPass = prompt(`Enter new password for user (${u.username}):`, '123456');
                    if (!newPass) return;
                    const res = await fetch(`/api/users/${u.user_id}/password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: newPass })
                    });
                    if (res.ok) {
                        alert(`Password updated for ${u.username}.`);
                    } else {
                        const err = await res.json();
                        alert(err.detail || 'Failed to reset password');
                    }
                }
            }
        }
    </script>
</body>
</html>
